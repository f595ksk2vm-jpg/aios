[project]
name = "aios"
version = "0.1.0"
description = "AI-OS: a modular operating system for autonomous digital organizations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "httpx>=0.27",
  "anthropic>=1.0",
  "cryptography>=42",
  "numpy>=1.26",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aios = "aios_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aios_kernel", "src/aios_workforce", "src/aios_ecosystem", "src/aios_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
