# LOCAL — everything on one machine you control. SQLite + local disk, one container.
# Models: point AI-OS at a model server on this machine or your LAN (Ollama shown), and/or add cloud keys in the UI.
#
#   docker compose -f deploy/docker-compose.local.yml up --build
#   docker compose -f deploy/docker-compose.local.yml --profile ollama up --build     # also run Ollama here
#
# Then open http://localhost:8600 and create the owner account.
services:
  aios:
    build: { context: .., dockerfile: deploy/Dockerfile }
    ports: ["127.0.0.1:8600:8600"]
    environment:
      AIOS_DEPLOYMENT_MODE: local
      AIOS_WORKER_LOCATION: local
      # SQLite under /data by default. Agent-written code runs in the subprocess sandbox inside this container.
    volumes: ["aios-data:/data"]
    security_opt: ["seccomp=unconfined"]   # lets the sandbox create network-less namespaces (unshare) for agent code
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes: ["ollama-models:/root/.ollama"]
    restart: unless-stopped
    # In the UI: AI-OS → Models → provider "local", base URL http://ollama:11434/v1 → Enable → Discover.

volumes:
  aios-data:
  ollama-models:
